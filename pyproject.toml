[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-churn"
version = "0.1.0"
description = "FastAPI service for ML churn prediction"
authors = [
    { name = "Semchenok Vsevolod" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "uvicorn>=0.49.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "joblib>=1.5.2"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27"
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
